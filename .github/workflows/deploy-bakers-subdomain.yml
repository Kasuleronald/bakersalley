name: Deploy to bakers.scholarsas.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BAKERS_FTP_HOST }}
          username: ${{ secrets.BAKERS_FTP_USERNAME }}
          password: ${{ secrets.BAKERS_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
